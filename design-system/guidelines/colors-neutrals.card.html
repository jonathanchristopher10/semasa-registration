<!-- @dsCard group="Colors" viewport="700x150" name="Ink, grey, cream" subtitle="Outlines, text, and the two page-background creams" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 18px;background:var(--surface-page);font-family:var(--font-body)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}.sw{width:104px}.chip{height:64px;border:var(--stroke) solid var(--border-ink);border-radius:var(--radius-chip)}.nm{font:800 11px var(--font-body);margin-top:6px;letter-spacing:.02em}.hex{font:700 10px var(--font-body);color:var(--text-muted);letter-spacing:.04em}.k{font:700 10px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--ink-900)"></div><div class="nm">ink-900</div><div class="hex">#222222</div></div><div class="sw"><div class="chip" style="background:var(--grey-500)"></div><div class="nm">grey-500</div><div class="hex">#6D6D6D</div></div><div class="sw"><div class="chip" style="background:var(--cream-50)"></div><div class="nm">cream-50</div><div class="hex">#FEF7E9</div></div><div class="sw"><div class="chip" style="background:var(--cream-100)"></div><div class="nm">cream-100</div><div class="hex">#FEEDCF</div></div><div class="sw"><div class="chip" style="background:var(--white)"></div><div class="nm">white</div><div class="hex">#FFFFFF</div></div></div></body></html>
