<!-- @dsCard group="Colors" viewport="700x150" name="Pastel tints" subtitle="Lighter fills for large surfaces where a full pastel would shout" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 18px;background:var(--surface-page);font-family:var(--font-body)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}.sw{width:104px}.chip{height:64px;border:var(--stroke) solid var(--border-ink);border-radius:var(--radius-chip)}.nm{font:800 11px var(--font-body);margin-top:6px;letter-spacing:.02em}.hex{font:700 10px var(--font-body);color:var(--text-muted);letter-spacing:.04em}.k{font:700 10px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--pink-100)"></div><div class="nm">pink-100</div><div class="hex">#FFE3E8</div></div><div class="sw"><div class="chip" style="background:var(--peach-100)"></div><div class="nm">peach-100</div><div class="hex">#FFF0DA</div></div><div class="sw"><div class="chip" style="background:var(--green-100)"></div><div class="nm">green-100</div><div class="hex">#E6F7E4</div></div><div class="sw"><div class="chip" style="background:var(--blue-100)"></div><div class="nm">blue-100</div><div class="hex">#E4F1FF</div></div><div class="sw"><div class="chip" style="background:var(--purple-100)"></div><div class="nm">purple-100</div><div class="hex">#F0E7FF</div></div></div></body></html>
