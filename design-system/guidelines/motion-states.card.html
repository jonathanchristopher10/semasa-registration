<!-- @dsCard group="Spacing" viewport="700x180" name="Hover & press states" subtitle="Lift 1px on hover, sink 1px on press, coral deepens — hover the buttons" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 18px;background:var(--surface-page);font-family:var(--font-body)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}.sw{width:104px}.chip{height:64px;border:var(--stroke) solid var(--border-ink);border-radius:var(--radius-chip)}.nm{font:800 11px var(--font-body);margin-top:6px;letter-spacing:.02em}.hex{font:700 10px var(--font-body);color:var(--text-muted);letter-spacing:.04em}.k{font:700 10px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}.b{font:700 17px var(--font-display);background:var(--primary);border:var(--stroke-bold) solid var(--border-ink);border-radius:var(--radius-pill);padding:13px 24px;cursor:pointer;transition:transform var(--dur-fast) var(--ease-pop),background var(--dur) var(--ease-out)}.b:hover{transform:var(--hover-lift);background:var(--primary-press)}.b:active{transform:var(--press-shift)}.b.s{background:#fff}.b.s:hover{background:var(--cream-100)}</style></head><body><div class="row" style="gap:16px;align-items:center">
<button class="b">Hover me</button><button class="b s">Secondary</button>
<div style="max-width:250px;font-size:12px;font-weight:600">120ms on press, 200ms on colour, <code>--ease-pop</code> for anything that grows.</div>
</div></body></html>
