<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 18px;background:var(--surface-page);font-family:var(--font-body)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}.sw{width:104px}.chip{height:64px;border:var(--stroke) solid var(--border-ink);border-radius:var(--radius-chip)}.nm{font:800 11px var(--font-body);margin-top:6px;letter-spacing:.02em}.hex{font:700 10px var(--font-body);color:var(--text-muted);letter-spacing:.04em}.k{font:700 10px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div style="width:300px;border:var(--stroke-heavy) solid var(--border-ink);border-radius:var(--radius-card);padding:8px var(--gutter-screen);background:var(--surface-page)">

<div style="font:700 22px var(--font-display)">Personal Data</div>
<div style="display:flex;flex-direction:column;gap:var(--gap-field)">
<div style="height:44px;border:var(--stroke) solid var(--border-ink);border-radius:var(--radius-input);background:#fff"></div>
<div style="height:44px;border:var(--stroke) solid var(--border-ink);border-radius:var(--radius-input);background:#fff"></div>
</div>
<div style="height:46px;border:var(--stroke-bold) solid var(--border-ink);border-radius:var(--radius-pill);background:var(--primary)"></div>
</div></div></body></html>
