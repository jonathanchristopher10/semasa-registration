<!-- @dsCard group="Brand" viewport="700x160" name="Page background" subtitle="Warm cream, top #FEF7E9 to bottom #FEEDCF — never white, never a photo" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 18px;background:var(--surface-page);font-family:var(--font-body)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}.sw{width:104px}.chip{height:64px;border:var(--stroke) solid var(--border-ink);border-radius:var(--radius-chip)}.nm{font:800 11px var(--font-body);margin-top:6px;letter-spacing:.02em}.hex{font:700 10px var(--font-body);color:var(--text-muted);letter-spacing:.04em}.k{font:700 10px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div style="height:110px;border:var(--stroke-bold) solid var(--border-ink);border-radius:var(--radius-card);background:linear-gradient(180deg,var(--cream-50),var(--cream-100));display:flex;align-items:center;justify-content:center;font:700 15px var(--font-body)">#FEF7E9 → #FEEDCF</div></body></html>
