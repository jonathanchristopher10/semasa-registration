<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 18px;background:var(--surface-page);font-family:var(--font-body)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}.sw{width:104px}.chip{height:64px;border:var(--stroke) solid var(--border-ink);border-radius:var(--radius-chip)}.nm{font:800 11px var(--font-body);margin-top:6px;letter-spacing:.02em}.hex{font:700 10px var(--font-body);color:var(--text-muted);letter-spacing:.04em}.k{font:700 10px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--coral-400)"></div><div class="nm">primary / coral-400</div><div class="hex">#FF8296</div></div><div class="sw"><div class="chip" style="background:var(--coral-500)"></div><div class="nm">primary-press</div><div class="hex">#FF6B6B</div></div><div class="sw"><div class="chip" style="background:var(--sky-600)"></div><div class="nm">sky-600</div><div class="hex">#028CFA</div></div><div class="sw"><div class="chip" style="background:var(--teal-400)"></div><div class="nm">teal-400</div><div class="hex">#4ECDC4</div></div><div class="sw"><div class="chip" style="background:var(--orange-400)"></div><div class="nm">orange-400</div><div class="hex">#FF9F1C</div></div></div></body></html>
