<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 18px;background:var(--surface-page);font-family:var(--font-body)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}.sw{width:104px}.chip{height:64px;border:var(--stroke) solid var(--border-ink);border-radius:var(--radius-chip)}.nm{font:800 11px var(--font-body);margin-top:6px;letter-spacing:.02em}.hex{font:700 10px var(--font-body);color:var(--text-muted);letter-spacing:.04em}.k{font:700 10px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="row" style="gap:24px;padding:10px 4px 20px"><div style="text-align:center"><div style="width:150px;height:76px;border:var(--stroke-bold) solid var(--border-ink);border-radius:var(--radius-card);background:#fff;box-shadow:var(--shadow-soft)"></div><div class="nm">soft</div></div><div style="text-align:center"><div style="width:150px;height:76px;border:var(--stroke-bold) solid var(--border-ink);border-radius:var(--radius-card);background:#fff;box-shadow:var(--shadow-card)"></div><div class="nm">card</div></div><div style="text-align:center"><div style="width:150px;height:76px;border:var(--stroke-bold) solid var(--border-ink);border-radius:var(--radius-card);background:#fff;box-shadow:var(--shadow-lift)"></div><div class="nm">lift</div></div><div style="text-align:center"><div style="width:150px;height:76px;border:var(--stroke-bold) solid var(--border-ink);border-radius:var(--radius-card);background:#fff"></div><div class="nm">none — the default</div></div></div></body></html>
