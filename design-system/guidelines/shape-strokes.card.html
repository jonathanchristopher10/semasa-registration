<!-- @dsCard group="Spacing" viewport="700x160" name="Ink outlines" subtitle="1px hairline · 2px fields · 2.5px cards & buttons · 3px frame" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 18px;background:var(--surface-page);font-family:var(--font-body)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}.sw{width:104px}.chip{height:64px;border:var(--stroke) solid var(--border-ink);border-radius:var(--radius-chip)}.nm{font:800 11px var(--font-body);margin-top:6px;letter-spacing:.02em}.hex{font:700 10px var(--font-body);color:var(--text-muted);letter-spacing:.04em}.k{font:700 10px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="row"><div style="text-align:center"><div style="width:120px;height:70px;border:var(--stroke-hair) solid var(--border-ink);border-radius:var(--radius-card);background:#fff"></div><div class="nm">hair</div><div class="hex">1px</div></div><div style="text-align:center"><div style="width:120px;height:70px;border:var(--stroke) solid var(--border-ink);border-radius:var(--radius-card);background:#fff"></div><div class="nm">stroke</div><div class="hex">2px</div></div><div style="text-align:center"><div style="width:120px;height:70px;border:var(--stroke-bold) solid var(--border-ink);border-radius:var(--radius-card);background:#fff"></div><div class="nm">bold</div><div class="hex">2.5px</div></div><div style="text-align:center"><div style="width:120px;height:70px;border:var(--stroke-heavy) solid var(--border-ink);border-radius:var(--radius-card);background:#fff"></div><div class="nm">heavy</div><div class="hex">3px</div></div></div></body></html>
