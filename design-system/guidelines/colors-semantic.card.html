<!-- @dsCard group="Colors" viewport="700x170" name="Semantic aliases" subtitle="What components actually reference" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 18px;background:var(--surface-page);font-family:var(--font-body)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}.sw{width:104px}.chip{height:64px;border:var(--stroke) solid var(--border-ink);border-radius:var(--radius-chip)}.nm{font:800 11px var(--font-body);margin-top:6px;letter-spacing:.02em}.hex{font:700 10px var(--font-body);color:var(--text-muted);letter-spacing:.04em}.k{font:700 10px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="row" style="gap:14px">
<div style="width:150px"><div class="chip" style="background:var(--surface-page)"></div><div class="nm">--surface-page</div><div class="hex">cream-50</div></div>
<div style="width:150px"><div class="chip" style="background:var(--surface-card)"></div><div class="nm">--surface-card</div><div class="hex">white</div></div>
<div style="width:150px"><div class="chip" style="background:var(--primary)"></div><div class="nm">--primary</div><div class="hex">coral-400</div></div>
<div style="width:150px"><div class="chip" style="background:var(--border-ink)"></div><div class="nm">--border-ink</div><div class="hex">ink-900</div></div>
<div style="width:150px"><div class="chip" style="background:var(--primary);display:flex;align-items:center;justify-content:center;font:700 14px var(--font-display)">Ink on coral</div><div class="nm">--text-on-primary</div><div class="hex">never white</div></div>
</div></body></html>
