<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 18px;background:var(--surface-page);font-family:var(--font-body)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}.sw{width:104px}.chip{height:64px;border:var(--stroke) solid var(--border-ink);border-radius:var(--radius-chip)}.nm{font:800 11px var(--font-body);margin-top:6px;letter-spacing:.02em}.hex{font:700 10px var(--font-body);color:var(--text-muted);letter-spacing:.04em}.k{font:700 10px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="row" style="align-items:center;gap:26px"><img src="../assets/icons/star-yellow.png" style="height:56px"><img src="../assets/icons/star-purple.png" style="height:56px"><img src="../assets/icons/flower.png" style="height:96px"><div style="max-width:240px;font-size:12px;font-weight:600">Rotate ±20°, keep behind content, never scale a sparkle above 40px inside a phone screen.</div></div></body></html>
