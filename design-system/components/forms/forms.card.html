<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:18px;background:var(--surface-page)}.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:12px}.sp-btn:hover{transform:var(--hover-lift)}.sp-btn:active{transform:var(--press-shift)}.sp-btn--primary:hover{background:var(--primary-press)}.sp-option:hover{transform:var(--hover-lift)}.sp-option:active{transform:var(--press-shift)}.k{font:700 11px var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}</style></head><body>
<div id="root"></div>
<script type="text/babel">
const { Button, IconDisc, TextField, SelectField, DateField, OptionCard, Card, Tag, InfoChip, SummaryRow, Logo, Sticker, StepHeader, ScreenHeader, PhoneFrame, Screen, QrCode, QrTicket } = window.SEMASAPIKNIK2026DesignSystem_c74c54;
function Demo(){const [v,setV]=React.useState("Nadia Putri");const [p,setP]=React.useState("");const [sel,setSel]=React.useState(0);
return (<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:18,alignItems:'start'}}>
  <div className="col">
    <TextField label="Full Name" placeholder="Full Name" required value={v} onChange={e=>setV(e.target.value)}/>
    <TextField label="Email Address" type="email" placeholder="you@email.com" error="That email looks off"/>
    <SelectField label="Purpose of Visit" required options={["Food","Fashion","Creative","Media","Others"]} value={p} onChange={e=>setP(e.target.value)}/>
    <DateField label="Visiting Date" required min="2026-06-26" max="2026-06-28" hint="26–28 June 2026" iconSrc="../../assets/icons/calendar.png"/>
  </div>
  <div className="col">
    <span className="k">OptionCard</span>
    {["General Visitor","Student","VIP / VVIP","Media","Exhibitor"].map((l,i)=>(
      <OptionCard key={l} label={l} tone={["coral","peach","blue","purple","green"][i]} selected={sel===i} onClick={()=>setSel(i)}/>
    ))}
  </div>
</div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body></html>
